[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soar-framework"
version = "0.2.0"
description = "SOAR: policy-agnostic research framework for SO-ARM robots, built on pysoarm."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SO-ARM research stack" }]
keywords = ["robotics", "so-arm", "so101", "embodied-ai", "imitation-learning", "teleoperation"]
dependencies = ["pysoarm>=0.1.2"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
parquet = ["pyarrow>=15"]
cameras = ["opencv-python>=4.9"]
train = ["numpy>=1.24", "torch>=2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
soar = "soar.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soar = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["hardware: needs a real arm on a serial port"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/soar"]
